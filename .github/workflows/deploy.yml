name: Build and deploy site

on:
  push:
    branches: [master]
  # Lets the Awesome-CV repo kick off a rebuild when the CV changes.
  # See .github/workflows/README.md for how to wire that up.
  repository_dispatch:
    types: [cv-updated]
  # Picks up CV changes even if the dispatch is not set up.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-cv:
    name: Compile CV
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site and the Awesome-CV submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Move the submodule to the tip of the CV repo
        run: git submodule update --remote --recursive Awesome-CV

      - name: Compile resume.tex with XeLaTeX
        # Deliberately the same image Awesome-CV/makecv.sh uses locally, NOT
        # texlive/texlive:latest. Current TeX Live ships Source Sans 3 under the
        # sourcesanspro package name, and its metrics differ enough from the
        # original Source Sans Pro that entries overflow their boxes and the CV
        # spills onto a third page. This image still has the older fonts, so CI
        # output matches what you get from makecv.sh.
        #
        # Run XeLaTeX twice. The class loads hyperref and bookmark, which write
        # their state to .aux and only settle on a second pass. Those files are
        # gitignored, so a local rebuild always has them lying around from the
        # previous run while CI starts cold - which is why a single CI pass laid
        # the CV out one entry short per page and spilled onto a third page.
        #
        # examples/resume.tex is the real CV; examples/cv.tex is a placeholder
        # cover letter, so "make" would build more than we need.
        run: |
          for pass in 1 2; do
            echo "::group::XeLaTeX pass $pass"
            docker run --rm -e HOME=/tmp -w /doc \
              -v "$PWD/Awesome-CV:/doc" \
              jnicolaus/docker-texlive-full \
              xelatex -interaction=nonstopmode -halt-on-error \
                -output-directory=examples examples/resume.tex
            echo "::endgroup::"
          done

      - name: Check the PDF came out
        # The page count is the quick tell for a layout regression: the CV has
        # fitted on two pages since the "fix spacing" commit, and a silent spill
        # onto a third is exactly what a toolchain drift looks like. Warn rather
        # than fail, so an unrelated content deploy is never blocked.
        run: |
          test -s Awesome-CV/examples/resume.pdf
          size=$(du -h Awesome-CV/examples/resume.pdf | cut -f1)
          if command -v pdfinfo >/dev/null 2>&1; then
            pages=$(pdfinfo Awesome-CV/examples/resume.pdf | awk '/^Pages:/{print $2}')
            echo "CV built: $size, $pages page(s)"
            if [ "${pages:-0}" -gt 2 ]; then
              echo "::warning::CV came out $pages pages (expected 2) - check the layout before sharing it."
            fi
          else
            echo "CV built: $size"
          fi

      - name: Hand it to the site build
        run: |
          mkdir -p cv-out
          cp Awesome-CV/examples/resume.pdf cv-out/cv.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv-out/cv.pdf
          retention-days: 1

  build-site:
    name: Build site
    runs-on: ubuntu-latest
    needs: build-cv
    steps:
      - uses: actions/checkout@v4

      - name: Replace the committed CV with the freshly built one
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: files

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
