# The order of the links in the header of the website.
#
# Changing the order here adjusts the order in the masthead. Removing a link
# prevents it from showing in the header, but does not remove the page itself.
#
# The site title on the left already links to the front page, so there is no
# separate "About" item here. Publications, talks, teaching and the CV all live
# on the front page, reachable from its table of contents.
#
# Set "new_tab: true" on an item to open it in a new browser tab.

main:
  - title: "Blog"
    url: /blog/

  - title: "Tutorials"
    url: /tutorials/

  - title: "CV"
    url: /files/cv.pdf
    new_tab: true

  - title: "Contact"
    url: /contact/

  # Re-enable once there is portfolio content (see _pages/portfolio.html)
  # - title: "Portfolio"
  #   url: /portfolio/
